name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Generate platform files
        run: |
          cd mobile
          flutter create --platforms=android --org com.alghouli --project-name alghouli_app .

      - name: Copy google-services.json
        run: |
          cd mobile
          if [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json android/app/google-services.json
            echo "google-services.json copied"
            ls -la android/app/google-services.json
          else
            echo "google-services.json NOT FOUND"
            exit 1
          fi

      - name: Patch build.gradle for Firebase
        run: |
          cd mobile
          if [ -f android/build.gradle ]; then
            sed -i "s|^dependencies {|dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'|" android/build.gradle
            echo "=== android/build.gradle ==="
            cat android/build.gradle
          fi
          if [ -f android/app/build.gradle ]; then
            if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
              echo "" >> android/app/build.gradle
              echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
            fi
            echo "=== android/app/build.gradle tail ==="
            tail -5 android/app/build.gradle
          fi

      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alghouli-apk-v8
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
