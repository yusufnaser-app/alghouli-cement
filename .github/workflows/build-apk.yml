name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Generate platform files
        run: |
          cd mobile
          flutter create --platforms=android --org com.alghouli --project-name alghouli_app .

      - name: Configure Firebase for Android
        run: |
          cd mobile
          if [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json android/app/google-services.json
            echo "✅ google-services.json copied"
          else
            echo "❌ google-services.json NOT FOUND"
            exit 1
          fi

          BUILD_GRADLE="android/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if ! grep -q "com.google.gms:google-services" "$BUILD_GRADLE"; then
              python3 << 'PYEOF'
with open('android/build.gradle', 'r') as f:
    s = f.read()
s = s.replace(
    "dependencies {",
    "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'",
    1
)
with open('android/build.gradle', 'w') as f:
    f.write(s)
print('✅ build.gradle updated')
PYEOF
            fi
            cat "$BUILD_GRADLE"
          fi

          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
              echo "" >> "$APP_GRADLE"
              echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
            fi
            tail -5 "$APP_GRADLE"
          fi

      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alghouli-apk-v7
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
