name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Generate platform files
        run: |
          cd mobile
          flutter create --platforms=android --org com.alghouli --project-name alghouli_app .

      - name: Copy google-services.json
        run: |
          cd mobile
          cp firebase/google-services.json android/app/google-services.json
          echo "google-services.json copied"

      - name: Patch gradle for Firebase
        run: |
          cd mobile
          python3 << 'PYEOF'
# 1. Patch settings.gradle
with open('android/settings.gradle', 'r') as f:
    s = f.read()

if 'com.google.gms.google-services' not in s:
    s = s.replace(
        'id "com.android.application"',
        'id "com.google.gms.google-services" version "4.4.2" apply false\n    id "com.android.application"',
        1
    )
    with open('android/settings.gradle', 'w') as f:
        f.write(s)
    print("Patched settings.gradle")
else:
    print("settings.gradle already has google-services")

print("--- settings.gradle ---")
with open('android/settings.gradle') as f:
    print(f.read())

# 2. Patch app/build.gradle
with open('android/app/build.gradle', 'r') as f:
    s = f.read()

if 'com.google.gms.google-services' not in s:
    s += "\napply plugin: 'com.google.gms.google-services'\n"
    with open('android/app/build.gradle', 'w') as f:
        f.write(s)
    print("Patched app/build.gradle")
else:
    print("app/build.gradle already has google-services")

print("--- app/build.gradle tail ---")
with open('android/app/build.gradle') as f:
    lines = f.readlines()
    print(''.join(lines[-5:]))
PYEOF

      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alghouli-apk-v10
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
