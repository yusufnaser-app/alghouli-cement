name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Generate platform files
        run: |
          cd mobile
          flutter create --platforms=android --org com.alghouli --project-name alghouli_app .

      - name: Fix Kotlin and compileSdk versions
        run: |
          cd mobile/android
          # Fix Kotlin version
          if [ -f build.gradle ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/' build.gradle
          fi
          if [ -f settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.22"/' settings.gradle
          fi
          # Fix compileSdk
          if [ -f app/build.gradle ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/' app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' app/build.gradle
          fi
          if [ -f app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' app/build.gradle.kts
          fi
          echo "=== build.gradle ==="
          cat build.gradle 2>/dev/null || true
          echo "=== app/build.gradle ==="
          cat app/build.gradle 2>/dev/null || true

      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alghouli-apk-v2
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
