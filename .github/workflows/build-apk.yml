name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Generate platform files
        run: |
          cd mobile
          flutter create --platforms=android --org com.alghouli --project-name alghouli_app .

      - name: Set app name (Arabic)
        run: |
          cd mobile
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="مؤسسة الغولي"/' "$MANIFEST"
          echo "--- patched AndroidManifest ---"
          grep "android:label" "$MANIFEST" || true

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Set app icon from logo
        run: |
          ls -la mobile/assets/images/logo.jpg
          pip install --quiet Pillow
          python3 scripts/set_icon.py mobile
          ls -la mobile/android/app/src/main/res/mipmap-*/ic_launcher.png

      - name: Copy google-services.json
        run: |
          cd mobile
          cp firebase/google-services.json android/app/google-services.json
          echo "--- Verify ---"
          ls -la android/app/google-services.json
          cat android/app/google-services.json | head -10

      - name: Bump NDK version
        run: |
          cd mobile
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/ndkVersion\s*=\s*.*/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
            echo "--- patched build.gradle.kts ---"
            grep -n "ndkVersion" android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i -E 's/ndkVersion\s+.*/ndkVersion "27.0.12077973"/' android/app/build.gradle
            echo "--- patched build.gradle ---"
            grep -n "ndkVersion" android/app/build.gradle
          else
            echo "❌ لا يوجد build.gradle(.kts)"; exit 1
          fi

      - name: Patch gradle for Firebase
        run: python3 scripts/patch-firebase.py

      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alghouli-apk-v11
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
